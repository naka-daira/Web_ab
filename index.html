<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A/Bテスト サンプル</title>

<style>
  /* JSが動かなかった時はAパターンだけ見せる（フォールバック） */
  html:not(.ab-js) [data-ab-variant]:not([data-ab-variant="original"]) { display: none; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #222; background: #fff; }
  header, footer { padding: 16px; background: #f3f5f8; }
  main { padding: 16px; min-height: 140vh; }
  .btn { display: inline-block; padding: 12px 20px; border-radius: 8px; color: #fff; text-decoration: none; font-weight: bold; }
  .btn-a { background: #1a73e8; }
  .btn-b { background: #e8453c; }

  /* テスト②：マークアップは1つ、CSSだけで差分を作る例 */
  .footer-banner { padding: 16px; border-radius: 8px; background: #fff; border: 1px solid #ccc; }
  html[data-ab-ftr_banner_2611="group_a"] .footer-banner { background: #fff4d6; border-color: #f0b400; font-size: 1.2em; }

  #debug { position: fixed; right: 8px; bottom: 8px; width: 360px; max-width: calc(100vw - 16px); max-height: 45vh; overflow: auto;
           font: 12px/1.4 monospace; background: #111; color: #0f0; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
</style>

<!-- ① テスト定義（テストを追加・終了するときはここだけ触る） -->
<script>
  window.AB_CONFIG = { cookieDomain: '' }; // 本番は '.lifecard.co.jp' にするとサブドメイン間で共有
  window.AB_TESTS = [
    { id: 'hdr_cta_2611',    method: 'ヘッダーCTA文言', slot: 3, groups: ['original', 'group_a'], cvEvent: 'cv', end: '2026-12-31' },
    { id: 'ftr_banner_2611', method: 'フッターバナー',  slot: 4, groups: ['original', 'group_a'], cvEvent: 'cv', end: '2026-12-31' }
  ];
</script>
<!-- ② 共通スクリプト（同期読み込み・GTMより前） -->
<script src="ab-test.js"></script>

<!-- ③ GTMスニペット（自分のコンテナIDに差し替え）
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
-->
</head>
<body>

<header>
  <strong>Vプリカ（サンプル）</strong>
  <!-- テスト①：A/B両方のマークアップを置き、割り当て外は自動で非表示 -->
  <div data-ab-test="hdr_cta_2611">
    <a class="btn btn-a" href="complete.html" data-ab-variant="original" data-ab-cv>アカウント開設はこちら</a>
    <a class="btn btn-b" href="complete.html" data-ab-variant="group_a" data-ab-cv>今すぐ無料で発行する！</a>
  </div>
</header>

<main>
  <p>スクロールするとフッターのテスト（ftr_banner_2611）が表示され、その時点で ab_impression が送られます。</p>
  <p><a href="?ab_force=hdr_cta_2611:group_a,ftr_banner_2611:group_a">QA：両方group_aで表示</a> ／
     <a href="?ab_force=hdr_cta_2611:original,ftr_banner_2611:original">QA：両方originalで表示</a> ／
     <a href="#" id="reset">振り分けをリセット</a></p>
</main>

<footer>
  <div class="footer-banner" data-ab-test="ftr_banner_2611">
    アプリでもっと便利に。
    <a href="#" data-ab-cv onclick="return false">アプリをダウンロード</a>
  </div>
</footer>

<pre id="debug"></pre>
<script>
  // ---- 動作確認用（本番には不要） ----
  (function () {
    var out = document.getElementById('debug');
    function render() {
      out.textContent = '割り当て: ' + JSON.stringify(abTest.all()) + '\n\ndataLayer:\n' +
        dataLayer.map(function (e) { return JSON.stringify(e); }).join('\n');
    }
    var orig = dataLayer.push;
    dataLayer.push = function () { var r = orig.apply(this, arguments); render(); return r; };
    render();
    document.getElementById('reset').onclick = function () {
      ['hdr_cta_2611', 'ftr_banner_2611'].forEach(function (id) {
        document.cookie = 'ab_' + id + '=; max-age=0; path=/';
      });
      location.href = location.pathname;
      return false;
    };
  })();
</script>
</body>
</html>
