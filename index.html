<style>

  html[data-ab-hero_app_btn_2611="group_a"] .home-hero-button__type { background-color: #E8453C; }

<script>
  window.AB_CONFIG = { cookieDomain: '' }; // GitHub Pagesでは空のままでOK
  window.AB_TESTS = [
    {
      id: 'hero_app_btn_2611',          // サイト内の識別子（英小文字・数字・_・-）
      method: 'ヒーローボタン改善',       // = 判定側の test_id / method
      slot: 2,                          // = 判定側 ab_param の customUser:ab_test_experiments_2
      groups: ['original', 'group_a'],  // = 判定側 groups の値。先頭がオリジナル
      weights: [50, 50],
      cvEvent: 'cv',                    // = 判定側 cv_filter の event_name（'cv' or 'tcv'）
      start: '2026-11-06',
      end: '2026-12-31'
    }
  ];
</script>

<pre id="debug"></pre>
<script>
  // 確認用パネル（?debug=0 で非表示）
  (function () {
    var out = document.getElementById('debug');
    if (/[?&]debug=0/.test(location.search)) { out.remove(); return; }
    function render() {
      out.textContent = '割り当て: ' + JSON.stringify(abTest.all()) +
        '\nsendTapEvent: ' + (typeof sendTapEvent === 'function' ? 'OK（GTMで定義済み）' : '未定義') +
        '\nCookie: ' + document.cookie +
        '\n\ndataLayer（population / cv / tcv / tap のみ）:\n' +
        dataLayer.filter(function (e) { return e.event && /^(population|t?cv|tap)$/.test(e.event); })
                 .map(function (e) { return JSON.stringify(e); }).join('\n');
    }
    // GTMが読み込み時に dataLayer.push を差し替えるため、フックせず定期的に描画する
    render(); setInterval(render, 500);
  })();
</script>
