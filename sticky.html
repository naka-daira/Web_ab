<style>
  html:not(.ab-js) [data-ab-variant]:not([data-ab-variant="original"]) { display: none; }

  /* 追跡型CTA（group_a にだけ表示される） */
  .sticky-cta {
    position: fixed; left: 50%; bottom: 16px; z-index: 1000;
    transform: translate(-50%, 160%); transition: transform .25s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: min(92vw, 420px); padding: 14px 0; border-radius: 999px;
    background: #E8453C; color: #fff; font-weight: bold; font-size: 16px; text-decoration: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .sticky-cta.is-shown { transform: translate(-50%, 0); }   /* ヒーローを過ぎたら出す */
  .sticky-cta img { width: 20px; height: 20px; filter: brightness(0) invert(1); }
</style>
<script>
  window.AB_CONFIG = { cookieDomain: '' }; // GitHub Pagesでは空のままでOK
  window.AB_TESTS = [
    {
      id: 'sticky_cta_2611',
      method: '追跡型CTA追加',          // = 判定側の test_id / method
      slot: 3,                          // = customUser:ab_test_experiments_3
      groups: ['original', 'group_a'],  // original：追跡型CTAなし ／ group_a：追跡型CTAあり
      weights: [50, 50],
      cvEvent: 'cv',
      population: 'pageview',           // 片方にしか要素が無いので「ページ表示」を母数にする
      start: '2026-11-09',
      end: '2026-12-31'
    }
  ];
</script>
<script src="ab-test.js"></script>

<div data-ab-test="sticky_cta_2611">
  <a href="#" class="sticky-cta" data-ab-variant="group_a" data-ab-cv
     onclick="sendTapEvent({event_category: 'VプリカHP', event_action: 'VプリカHP',event_label: '追跡型CTA'}); return false;">
    <img src="assets/icon_download.svg" alt="">Ｖプリカアプリをダウンロード
  </a>
</div>
<script>
  // group_a のとき：ヒーローが画面から消えたら追跡型CTAを出す
  (function () {
    var cta = document.querySelector('.sticky-cta'), hero = document.getElementById('hero');
    if (!cta || !hero || abTest.get('sticky_cta_2611') !== 'group_a') return;
    if (!('IntersectionObserver' in window)) { cta.classList.add('is-shown'); return; }
    new IntersectionObserver(function (es) {
      cta.classList.toggle('is-shown', !es[0].isIntersecting);
    }).observe(hero);
  })();
</script>

<pre id="debug"></pre>
<script>
  // 確認用パネル（?debug=0 で非表示）
  (function () {
    var out = document.getElementById('debug');
    if (/[?&]debug=0/.test(location.search)) { out.remove(); return; }
    function render() {
      out.textContent = '割り当て: ' + JSON.stringify(abTest.all()) +
        '\nsendTapEvent: ' + (typeof sendTapEvent === 'function' ? 'OK（GTMで定義済み）' : '未定義') +
        '\nCookie: ' + document.cookie +
        '\n\ndataLayer（population / cv / tcv / tap のみ）:\n' +
        dataLayer.filter(function (e) { return e.event && /^(population|t?cv|tap)$/.test(e.event); })
                 .map(function (e) { return JSON.stringify(e); }).join('\n');
    }
    render(); setInterval(render, 500);
  })();
</script>
